[pytest]
testpaths = assignment_tests
addopts = -ra --strict-markers
markers =
    smoke: fast sanity checks (run first)
    ecp: equivalence class partitioning tests
    bva: boundary value analysis tests
    negative: invalid input / error handling tests
    datadriven: tests fed from external CSV files
    member_a: tests written by Member A
    member_b: tests written by Member B
